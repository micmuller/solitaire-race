worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # Aggregate beta ingress cap; do not trust client-supplied IP headers.
  limit_req_zone $server_name zone=beta:1m rate=30r/s;
  limit_conn_zone $server_name zone=connections:1m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    limit_req zone=beta burst=100 nodelay;
    limit_req_status 429;
    limit_conn connections 64;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location = / { return 302 /vnext/pixi/; }
    location / {
      set $backend http://app:3011;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host solitairehighnoon-test.stillorbit.net;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Forwarded "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
    }
  }
}
