<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Solitaire HighNoon vNext</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">H</span>
      <div><strong>Solitaire HighNoon</strong><small>vNext authoritative</small></div>
    </div>
    <div class="telemetry" aria-label="Verbindungsstatus">
      <span id="connection-dot" class="status-dot"></span>
      <span id="connection-label">Nicht verbunden</span>
      <span id="revision">rev -</span>
      <span id="state-hash" class="mono">hash -</span>
    </div>
  </header>

  <section id="session-panel" class="session-band">
    <div class="session-group">
      <label>Seed<input id="seed" value="WEB-VNEXT-001" autocomplete="off"></label>
      <label>Modus<select id="mode"><option value="split">Split</option><option value="shared">Shared</option></select></label>
      <button id="create-match" class="primary">Match starten</button>
    </div>
    <div id="invite-panel" class="session-group invite-group" hidden>
      <label>Invite-Link<input id="invite-link" readonly autocomplete="off"></label>
      <button id="copy-invite">Kopieren</button>
    </div>
    <div class="session-divider"></div>
    <div class="session-group direct-join">
      <label>Match-ID<input id="match-id" placeholder="m-..." autocomplete="off"></label>
      <label>Spieler<select id="client-id"><option value="p1">P1</option><option value="p2">P2</option></select></label>
      <button id="connect-match">Verbinden</button>
    </div>
  </section>

  <main id="game" class="game-shell" hidden>
    <section class="player-area opponent-area">
      <div class="area-heading"><span>Gegner</span><strong id="opponent-id">P2</strong></div>
      <div class="lane">
        <div class="stock-waste compact">
          <div><span class="zone-label">Stock</span><div id="opp-stock" class="card-slot"></div></div>
          <div><span class="zone-label">Waste</span><div id="opp-waste" class="card-slot"></div></div>
        </div>
        <div id="opp-tableau" class="tableau compact-tableau"></div>
      </div>
    </section>

    <section class="foundation-area">
      <div class="area-heading"><span>Gemeinsame Foundations</span><strong id="foundation-count">0 / 104</strong></div>
      <div id="foundations" class="foundations"></div>
    </section>

    <section class="player-area local-area">
      <div class="area-heading"><span>Dein Spiel</span><strong id="local-id">P1</strong></div>
      <div class="lane local-lane">
        <div class="stock-waste">
          <div><span class="zone-label">Stock</span><button id="local-stock" class="card-slot action-slot" title="Karte ziehen"></button></div>
          <div><span class="zone-label">Waste</span><div id="local-waste" class="card-slot"></div></div>
        </div>
        <div id="local-tableau" class="tableau"></div>
      </div>
    </section>
  </main>

  <footer class="status-bar">
    <span id="message">Match erstellen oder bestehender Match-ID beitreten.</span>
    <div class="status-actions">
      <span id="selection-label" hidden></span>
      <button id="cancel-selection" class="icon-button" title="Auswahl aufheben" aria-label="Auswahl aufheben" hidden>×</button>
      <span id="pending" hidden>Action wird geprüft ...</span>
    </div>
  </footer>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
